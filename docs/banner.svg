<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Claude Skills for Qualcomm QAIRT and Hexagon HTP">
  <title>Claude Skills for Qualcomm QAIRT / Hexagon HTP</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#131d34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="340" rx="16" fill="url(#bg)"/>

  <!-- ambient glow, built from layered ellipses rather than a filter so that
       GitHub's SVG sanitizer cannot strip it -->
  <ellipse cx="600" cy="120" rx="430" ry="150" fill="#2563eb" opacity="0.10"/>
  <ellipse cx="600" cy="120" rx="280" ry="100" fill="#7c3aed" opacity="0.10"/>

  <!-- lattice: a die floorplan, not decoration for its own sake -->
  <g fill="#93b4e8" opacity="0.11">
    <circle cx="60"  cy="40"  r="1.6"/><circle cx="120" cy="40"  r="1.6"/><circle cx="180" cy="40"  r="1.6"/>
    <circle cx="1020" cy="40" r="1.6"/><circle cx="1080" cy="40" r="1.6"/><circle cx="1140" cy="40" r="1.6"/>
    <circle cx="60"  cy="100" r="1.6"/><circle cx="120" cy="100" r="1.6"/>
    <circle cx="1080" cy="100" r="1.6"/><circle cx="1140" cy="100" r="1.6"/>
    <circle cx="60"  cy="300" r="1.6"/><circle cx="120" cy="300" r="1.6"/><circle cx="180" cy="300" r="1.6"/>
    <circle cx="1020" cy="300" r="1.6"/><circle cx="1080" cy="300" r="1.6"/><circle cx="1140" cy="300" r="1.6"/>
  </g>

  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="600" y="112" text-anchor="middle" fill="#eaf0fb"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="600">Claude Skills for Qualcomm QAIRT</text>
  <text x="600" y="158" text-anchor="middle" fill="#7f9bc4"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400">ONNX to Hexagon HTP &#8212; conversion, quantization, cross-compilation</text>

  <rect x="470" y="182" width="260" height="1" fill="url(#fade)"/>

  <!-- the pipeline the skills automate, in the order they run -->
  <g font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace"
     font-size="13" font-weight="500" letter-spacing="1.2" text-anchor="middle">

    <rect x="180" y="222" width="168" height="56" rx="9" fill="#111c31" stroke="#2c3f5e" stroke-width="1"/>
    <text x="264" y="255" fill="#c3d4ec">ONNX</text>

    <rect x="404" y="222" width="168" height="56" rx="9" fill="#111c31" stroke="#2c3f5e" stroke-width="1"/>
    <text x="488" y="255" fill="#c3d4ec">CONVERT</text>

    <rect x="628" y="222" width="168" height="56" rx="9" fill="#111c31" stroke="#2c3f5e" stroke-width="1"/>
    <text x="712" y="255" fill="#c3d4ec">QUANTIZE</text>

    <rect x="852" y="222" width="168" height="56" rx="9" fill="#0f2033" stroke="#3f8fd8" stroke-width="1.4"/>
    <text x="936" y="255" fill="#8ec5ff">HEXAGON HTP</text>
  </g>

  <g stroke="#3a527a" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M356 250 H 388"/>
    <path d="M580 250 H 612"/>
    <path d="M804 250 H 836"/>
  </g>
  <g fill="#4a6795">
    <path d="M388 250 l -7 -4.5 v 9 z"/>
    <path d="M612 250 l -7 -4.5 v 9 z"/>
    <path d="M836 250 l -7 -4.5 v 9 z"/>
  </g>
</svg>
